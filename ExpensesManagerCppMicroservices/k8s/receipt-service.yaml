apiVersion: apps/v1
kind: Deployment
metadata:
  name: receipt-service
  namespace: expenses
  labels:
    app: receipt-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: receipt-service
  template:
    metadata:
      labels:
        app: receipt-service
    spec:
      containers:
        - name: receipt-service
          image: receipt-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: app-env
          env:
            # Inside the cluster the DB host is the postgres Service name.
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: CHEQUES_SERVICE_APP_PORT
              value: "4000"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: receipt-service
  namespace: expenses
  labels:
    app: receipt-service
spec:
  type: NodePort
  selector:
    app: receipt-service
  ports:
    - name: http
      port: 4000
      targetPort: http
      nodePort: 30400