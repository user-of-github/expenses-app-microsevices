apiVersion: batch/v1
kind: Job
metadata:
  name: migration-job
  namespace: expenses
  labels:
    app: migration-job
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: migration-job
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: POSTGRES_USER
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do echo "waiting for postgres..."; sleep 3; done
      containers:
        - name: liquibase
          image: liquibase/liquibase:4.29
          imagePullPolicy: IfNotPresent
          workingDir: /liquibase/changelog
          args:
            - --url=jdbc:postgresql://postgres:5432/$(POSTGRES_DB)
            - --changelog-file=changelog-master.yaml
            - --username=$(POSTGRES_USER)
            - --password=$(POSTGRES_PASSWORD)
            - update
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: changelogs
              mountPath: /liquibase/changelog
      volumes:
        # Changelogs are supplied as a ConfigMap (see k8s/liquibase-configmap.yaml).
        # keys are basenames; items reconstruct the migrations/ and seeds/ folders.
        - name: changelogs
          configMap:
            name: liquibase-changelogs
            items:
              - key: changelog-master.yaml
                path: changelog-master.yaml
              - key: 2026-09-19-01_create-base-classificators.sql
                path: migrations/2026-09-19-01_create-base-classificators.sql
              - key: 2026-09-19-02_create-base-entities.sql
                path: migrations/2026-09-19-02_create-base-entities.sql
              - key: 2026-10-04-01_add-reports-table.sql
                path: migrations/2026-10-04-01_add-reports-table.sql
              - key: 2026-10-04-02_add-first-report-plsql.sql
                path: migrations/2026-10-04-02_add-first-report-plsql.sql
              - key: 2026-09-19-01_seed-initial-classificators-data.sql
                path: seeds/2026-09-19-01_seed-initial-classificators-data.sql
              - key: 2026-09-20-01_seed-cheques-for-testing.sql
                path: seeds/2026-09-20-01_seed-cheques-for-testing.sql
              - key: 2026-10-04-01_save-new-report-proc-to-table.sql
                path: seeds/2026-10-04-01_save-new-report-proc-to-table.sql
              - key: 2026-10-04-02_seed-more-cheques-for-testing.sql
                path: seeds/2026-10-04-02_seed-more-cheques-for-testing.sql