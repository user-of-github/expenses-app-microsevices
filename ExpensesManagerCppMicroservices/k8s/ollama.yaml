apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: expenses
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: expenses
  labels:
    app: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: ollama
              containerPort: 11434
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - ollama list || exit 1
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - ollama list || exit 1
            initialDelaySeconds: 30
            periodSeconds: 20
          # GPU (optional): enable on a node with the NVIDIA device plugin.
          # resources:
          #   limits:
          #     nvidia.com/gpu: 1
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ollama-data
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: expenses
  labels:
    app: ollama
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - name: ollama
      port: 11434
      targetPort: ollama
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-init
  namespace: expenses
  labels:
    app: ollama-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: ollama-init
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: http://ollama:11434
          command:
            - sh
            - -c
            - until ollama list >/dev/null 2>&1; do echo "waiting for ollama..."; sleep 5; done
      containers:
        - name: ollama-pull
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: http://ollama:11434
            - name: OLLAMA_MODEL
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: OLLAMA_MODEL
          command:
            - sh
            - -c
            - ollama pull "$OLLAMA_MODEL" && echo "model pulled successfully"