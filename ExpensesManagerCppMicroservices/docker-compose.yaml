services:
  # database
  postgres:
    image: postgres:17-alpine
    container_name: expense_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expense_db_default}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-expense_db_default}"]
      interval: 3s
      timeout: 4s
      retries: 4
    networks:
      - receipts_network


  # Liquibase migrations
  migration-job:
    image: liquibase/liquibase:4.29
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./liquibase:/liquibase/changelog
    working_dir: /liquibase/changelog
    command: >
      --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-expense_db_default}
      --changelog-file=changelog-master.yaml
      --username=${POSTGRES_USER:-postgres}
      --password=${POSTGRES_PASSWORD}
      update
    networks:
      - receipts_network


  receipt-service:
    build:
      context: ./receipt-service
      dockerfile: Dockerfile
    container_name: receipt_service_app
    restart: always
    env_file:
      - .env
    environment:
      # !!! Inside docker network host === docker service name
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    ports:
      - "${CHEQUES_SERVICE_APP_PORT:-4000}:${CHEQUES_SERVICE_APP_PORT:-4000}"
    depends_on:
      postgres:
        condition: service_healthy 
      migration-job:
        condition: service_completed_successfully
    networks:
      - receipts_network


  reports-service:
    build:
      context: ./reports-service
      dockerfile: Dockerfile
    container_name: reports_service_app
    restart: always
    env_file:
      - .env
    environment:
      # !!! Inside docker network host === docker service name
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    ports:
      - "${REPORTS_SERVICE_APP_PORT:-4001}:${REPORTS_SERVICE_APP_PORT:-4001}"
    depends_on:
      postgres:
        condition: service_healthy 
      migration-job:
        condition: service_completed_successfully
    networks:
      - receipts_network


  # Ollama LLM service
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    restart: always
    gpus: all
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_network


  # Initialize Ollama model
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      ollama pull ${OLLAMA_MODEL:-qwen3:1.7b} &&
      echo 'Model pulled successfully'"
    networks:
      - ai_network


  # AI Assistant service
  ai-assistant-service:
    build:
      context: ./ai-assistant-service
      dockerfile: Dockerfile
    container_name: ai_assistant_service_app
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "${AI_SERVICE_PORT:-4002}:${AI_SERVICE_PORT:-4002}"
    depends_on:
      postgres:
        condition: service_healthy
      migration-job:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks:
      - receipts_network
      - ai_network

    
volumes:
  postgres-data:
  ollama-data:

networks:
  receipts_network:
    driver: bridge
  ai_network:
    driver: bridge