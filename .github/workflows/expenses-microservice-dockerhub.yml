name: Expenses CPP microservices --> DockerHub

# Group prefix applied to every image so all services clearly belong to expenses-app.
# Resulting images: <DOCKER_HUB_USERNAME>/<IMAGE_PREFIX><service>:latest
env:
  IMAGE_PREFIX: expenses-app-

on:
  push:
    paths:
      - 'ExpensesManagerCppMicroservices/receipt-service/**'
      - 'ExpensesManagerCppMicroservices/reports-service/**'
      - 'ExpensesManagerCppMicroservices/ai-assistant-service/**'
      - '.github/**'

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest

    # One parallel job per microservice.
    strategy:
      fail-fast: false
      matrix:
        service:
          - receipt-service
          - reports-service
          - ai-assistant-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authorize
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push
        run: |
          IMAGE="${{ secrets.DOCKER_HUB_USERNAME }}/${IMAGE_PREFIX}${{ matrix.service }}:latest"
          docker build -t "$IMAGE" ./ExpensesManagerCppMicroservices/${{ matrix.service }}
          docker push "$IMAGE"